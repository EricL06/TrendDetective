<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendDetective</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            min-width: 280px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }
        button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>TrendDetective</h1>
        <div id="button-container" class="button-group">
            <!-- Add HTML buttons here with class="py-button" and id="<button_id>" -->
            <button id="detect_trend" class="py-button" type="button">Detect Trend</button>
        </div>
    </div>

    <script>
        async function triggerButton(buttonId) {
            await fetch(`/api/buttons/${encodeURIComponent(buttonId)}`, {
                method: 'POST',
            });
        }

        // Automatically connect every HTML button with class="py-button" using its id
        document.querySelectorAll('button.py-button').forEach((buttonElement) => {
            buttonElement.addEventListener('click', () => {
                triggerButton(buttonElement.id);
            });
        });
    </script>
</body>
</html>
