<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrendDetective · Global Explorer</title>
  <meta name="description" content="Globale Temperaturtrends vergleichen: Karte, Regionen, Statistik.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232166ac'/%3E%3Cpath d='M4 18c6-6 10 4 16-2s8-2 8-2v4c-4 6-10 10-16 9-5-1-8-5-8-9z' fill='%23d6604d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="explorer.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>TrendDetective <span>Global Explorer</span></h1>
        <p class="dataset" id="dataset-line">Lade Datensatz …</p>
      </div>
    </div>
    <div class="seg ds-seg" id="ds-seg" role="radiogroup" aria-label="Datensatz">
      <button type="button" role="radio" data-ds="gistemp" title="NASA GISTEMP v4 – Oberflächentemperatur seit 1880">🌡 Temperatur</button>
      <button type="button" role="radio" data-ds="gpcp" title="GPCP v2.3 – Niederschlag seit 1979">🌧 Niederschlag</button>
    </div>
    <nav class="topnav">
      <button class="ghost" id="btn-about" type="button">Methodik</button>
      <a class="ghost" href="/" title="Die bisherige stationsbasierte Analyse">Stationsanalyse →</a>
    </nav>
  </header>

  <main class="layout">
    <section class="map-area" aria-label="Weltkarte">
      <div id="map"></div>

      <!-- Left: map layer controls -->
      <aside class="panel controls" id="controls">
        <div class="panel-head">
          <h2>Kartenebene</h2>
          <button class="icon-btn" id="btn-collapse-controls" type="button" aria-label="Einklappen" title="Einklappen">–</button>
        </div>
        <div class="panel-body">
          <div class="seg" id="layer-seg" role="radiogroup" aria-label="Ebene"></div>
          <p class="hint" id="layer-hint"></p>

          <label class="field">
            <span>Zeitraum</span>
            <div class="range-row">
              <input type="number" id="start-year" inputmode="numeric">
              <span class="dash">–</span>
              <input type="number" id="end-year" inputmode="numeric">
            </div>
          </label>
          <div class="chips small" id="period-presets"></div>

          <div class="two-col">
            <label class="field">
              <span>Jahreszeit</span>
              <select id="season"></select>
            </label>
            <label class="field">
              <span>Referenzperiode</span>
              <select id="baseline"></select>
            </label>
          </div>

          <details class="advanced">
            <summary>Darstellung</summary>
            <label class="toggle"><input type="checkbox" id="opt-sig" checked> Nicht signifikante Zellen punktieren (p ≥ 0,05)</label>
            <label class="toggle"><input type="checkbox" id="opt-smooth" checked> Zwischen Gitterpunkten interpolieren</label>
            <label class="toggle"><input type="checkbox" id="opt-globe" checked> Globus-Ansicht</label>
            <label class="field inline"><span>Deckkraft</span><input type="range" id="opacity" min="0.2" max="1" step="0.05" value="0.82"></label>
            <label class="field inline"><span>Farbskala ±</span>
              <input type="number" id="scale-max" step="0.1" min="0.05" placeholder="auto"></label>
          </details>
        </div>
      </aside>

      <!-- Legend -->
      <div class="legend" id="legend" aria-live="polite">
        <div class="legend-title" id="legend-title"></div>
        <canvas id="legend-bar" width="260" height="12"></canvas>
        <div class="legend-ticks" id="legend-ticks"></div>
        <div class="legend-stats" id="legend-stats"></div>
      </div>

      <!-- Timeline for the yearly animation -->
      <div class="timeline" id="timeline" hidden>
        <button class="play" id="btn-play" type="button" aria-label="Abspielen">▶</button>
        <input type="range" id="year-slider" min="1880" max="2025" value="2025" aria-label="Jahr">
        <output id="year-out">2025</output>
      </div>

      <div class="map-tools">
        <button class="tool" id="btn-draw" type="button" title="Region als Rechteck aufziehen">▭ Region zeichnen</button>
      </div>

      <div class="hover-card" id="hover-card" hidden></div>
      <div class="loading" id="loading" hidden><span class="spinner"></span><span id="loading-text">Berechne …</span></div>
      <div class="toast" id="toast" hidden></div>
    </section>

    <!-- Right: region selection -->
    <aside class="sidebar" aria-label="Regionen">
      <div class="side-section">
        <h2>Regionen vergleichen</h2>
        <div class="search">
          <input type="search" id="search" placeholder="Ort, Land, Meer oder Koordinate …" autocomplete="off">
          <ul class="search-results" id="search-results" hidden></ul>
        </div>
        <ul class="selected" id="selected"></ul>
        <p class="hint" id="selected-hint">Klick auf die Karte = Gitterzelle ansehen · ▭ = Rechteck · Suche = Ort/Land</p>
      </div>
      <div class="side-section presets">
        <h3>Vordefinierte Regionen</h3>
        <div id="preset-groups"></div>
      </div>
    </aside>

    <!-- Bottom: analysis -->
    <section class="analysis" id="analysis">
      <div class="resize-handle" id="resize-handle" title="Höhe ziehen" aria-hidden="true"></div>
      <div class="analysis-head">
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" data-tab="series" aria-selected="true">Zeitreihe</button>
          <button role="tab" data-tab="tempo">Erwärmungstempo</button>
          <button role="tab" data-tab="stripes">Wärmestreifen</button>
          <button role="tab" data-tab="seasons">Jahreszeiten</button>
          <button role="tab" data-tab="dist">Extreme</button>
          <button role="tab" data-tab="stats">Statistik</button>
          <button role="tab" data-tab="ranking">Ranking</button>
          <button role="tab" data-tab="zonal">Breitengrade</button>
        </div>
        <div class="analysis-meta" id="analysis-meta"></div>
        <button class="ghost small" id="btn-csv" type="button" title="Zeitreihen der Regionen als CSV herunterladen">CSV</button>
        <button class="ghost small" id="btn-link" type="button" title="Link mit allen Einstellungen kopieren">Link teilen</button>
        <button class="icon-btn" id="btn-toggle-analysis" type="button" aria-label="Analyse ein-/ausklappen" title="Ein-/ausklappen">▾</button>
      </div>
      <div class="analysis-body" id="analysis-body"></div>
    </section>
  </main>

  <dialog id="about">
    <form method="dialog">
      <h2>Datengrundlage &amp; Methodik</h2>
      <div id="about-body"></div>
      <button class="primary" value="close">Schließen</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
